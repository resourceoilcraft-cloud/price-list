.brand-header{display:flex;align-items:center;justify-content:flex-start;gap:1.25rem;max-width:1080px;margin:0 auto;padding:1.25rem 1.25rem .75rem;text-align:left}
.brand-header-text h1{margin:0 0 .3rem;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em;font-weight:600}
.brand-header-text p{margin:0;color:var(--text-muted);font-size:.85rem}
.brand-logo{flex:0 0 auto;width:112px;height:112px}
.brand-logo svg{display:block;width:100%;height:100%}
.tabs{display:flex;justify-content:center;gap:.5rem;padding:1.25rem 1rem 0;flex-wrap:wrap}
.tab{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:.6rem 1.2rem;font-size:.88rem;font-weight:600;color:var(--text-muted);cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fffaf0}
main{max-width:1080px;margin:0 auto;padding:1.25rem 1rem 2rem}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.search{max-width:420px;margin:0 auto 1rem}
.search input{width:100%;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:999px;font-size:.95rem;background:var(--surface);color:var(--text)}
.search input:focus{outline:none;border-color:var(--accent)}
.category-pills{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:600px;margin:0 auto 1rem}
.cat-pill{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fffaf0}
.price-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.price-head{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:1.25rem;padding:.8rem 1.25rem;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.price-list .price-group{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:1.25rem;align-items:center;padding:.9rem 1.25rem;border-bottom:1px solid var(--border)}
.price-list .price-group:last-child{border-bottom:none}
.price-list .price-group:hover{background:var(--surface-2)}
.price-group h3{margin:0;font-size:1.2rem;font-weight:600;letter-spacing:0}
.price-group .meta{margin:.15rem 0 0;font-size:.85rem;color:var(--text-faint)}
.price-variants{display:flex;flex-direction:column;gap:.25rem}
.price-line{display:flex;align-items:baseline;gap:.5rem}
.price-line .amount{color:var(--text-amount);font-size:.95rem;flex:0 0 auto;font-variant-numeric:tabular-nums;min-width:3.6rem}
.price-line .dots{flex:1 1 auto;height:1px;background:repeating-linear-gradient(to right,var(--border) 0 2px,transparent 2px 6px);transform:translateY(-3px)}
.price-btn{flex:0 0 5.4rem;text-align:right;background:none;border:none;padding:0;font:inherit;font-size:1.15rem;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--text-faint);text-underline-offset:3px;transition:color .12s ease,transform .12s ease}
.price-btn:hover,.price-btn:active{color:var(--accent);text-decoration-color:var(--accent)}
.price-btn:active{transform:scale(0.94)}
.price-btn.added{color:#4f8b5b;text-decoration-color:#4f8b5b}
.price-search-empty{text-align:center;color:var(--text-faint);padding:2.5rem 1rem}
@media (max-width:620px){
  .price-head{display:none}
  .price-list .price-group{grid-template-columns:1fr;gap:.4rem}
  .brand-logo{width:96px;height:96px}
}
@media (min-width:621px){
  /* На десктопе вся страница помещается в экран целиком, без прокрутки — скроллится только
     содержимое внутри активной вкладки (прайс-лист или список), а не страница целиком. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .brand-header,.tabs{flex:0 0 auto}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .tab-content.active{flex:1;min-height:0;display:flex;flex-direction:column}
  .price-card{flex:1;min-height:0;display:flex;flex-direction:column}
  .price-list{flex:1;min-height:0;overflow-y:auto;padding-right:.4rem;margin-right:-.4rem}
  #tab-cart .card{flex:1;min-height:0;display:flex;flex-direction:column}
  .cart-rows-scroll{flex:1;min-height:0}
  footer{flex:0 0 auto}
}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:.65rem 1.1rem;border-radius:999px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.15rem;height:1.15rem;padding:0 .3rem;margin-left:.3rem;border-radius:999px;background:#fffaf0;color:var(--accent);font-size:.72rem;font-weight:800}
.tab.active .tab-badge{background:rgba(255,255,255,.28);color:#fffaf0}
.cart-rows-scroll{max-height:48vh;overflow-y:auto;padding-right:.4rem;margin-right:-.4rem}
.order-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;padding:1rem 0;border-bottom:1px dashed var(--border)}
.order-row:first-child{padding-top:0}
.order-row:last-child{border-bottom:none}
.order-row .col{display:flex;flex-direction:column;gap:.3rem;flex:1 1 130px;min-width:120px}
.order-row .col.grow{flex:2 1 200px}
.order-row .col.price-sum{flex:0 1 90px;min-width:80px}
.order-row label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.order-row select,.order-row input{padding:.55rem .65rem;border:1.5px solid var(--border);border-radius:8px;font-size:.86rem;background:var(--surface);color:var(--text);width:100%}
.order-row select:focus,.order-row input:focus{outline:none;border-color:var(--accent)}
.order-row.readonly .ro-value{padding:.55rem 0;font-size:.9rem;font-weight:600;color:var(--text)}
.order-row .price-sum span{display:block;padding:.55rem 0;font-weight:700;font-size:.9rem;text-align:right}
.order-row .remove{flex:0 0 auto;background:var(--surface-2);border:none;border-radius:8px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;color:var(--text-muted)}
.order-row .remove:hover{color:#a1463d}
.add-row{margin-top:1rem;background:transparent;border:1.5px dashed var(--border-strong,var(--border));border-radius:10px;padding:.7rem 1rem;font-size:.88rem;font-weight:600;color:var(--accent);cursor:pointer;width:100%}
.cart-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.25rem;padding-top:1.1rem;border-top:1px solid var(--border)}
.cart-footer .info{display:flex;flex-direction:column;line-height:1.3}
.cart-footer .count{font-size:.78rem;color:var(--text-muted)}
.cart-footer .sum{font-weight:800;font-size:1.3rem;color:var(--accent)}
.cart-footer .actions{display:flex;gap:.5rem;flex-wrap:wrap}
.cart-footer button.primary{background:var(--accent);color:#fffaf0;border:none;border-radius:999px;padding:.7rem 1.4rem;font-weight:700;font-size:.9rem;cursor:pointer}
.cart-footer button.primary:disabled{opacity:.35;cursor:not-allowed}
.cart-footer button.ghost{background:transparent;border:1.5px solid var(--border);border-radius:999px;padding:.7rem 1.1rem;font-size:.85rem;color:var(--text-muted);cursor:pointer}
.empty{text-align:center;color:var(--text-faint);padding:2.5rem 1rem}
footer{position:relative;text-align:center;color:var(--text-faint);font-size:.72rem;padding:1rem}
</style>
</head>

<script>
(function () {
  var CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
  // При "Поделиться" мы кладём сюда текущий собранный список (см. shareCart) и пересобираем
  // всю страницу заново — получатель открывает её и сразу видит готовый список, а не пустой.
  var CART_PRESET = JSON.parse(document.getElementById('cart-preset').textContent || 'null');
  var rows = (CART_PRESET && CART_PRESET.length > 0) ? CART_PRESET : [{ group: null, variant: null, qty: 1 }];
  // Файл открыт с уже готовым списком — значит это копия, отправленная клиенту, а не рабочий
  // инструмент владельца: прайс-лист и все кнопки редактирования тут ни к чему.
  var READONLY = !!(CART_PRESET && CART_PRESET.length > 0);
  var activeCategory = null;
  var OTHER_CATEGORY = '__other__';

  function formatMoney(v) { return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽'; }
  function formatAmount(v) { return (Math.round(v * 10000) / 10000).toString(); }

  function findVariant(groupIdx, variantId) {
    if (groupIdx === null || groupIdx === undefined || variantId === null || variantId === undefined) return null;
    var g = CATALOG[groupIdx];
    if (!g) return null;
    for (var i = 0; i < g.variants.length; i++) {
      if (g.variants[i].id === variantId) return g.variants[i];
    }
    return null;
  }

  // ---- Пиллы категорий над прайс-листом: строятся из различных g.category, найденных в CATALOG ----
  function getCategories() {
    var set = {};
    CATALOG.forEach(function (g) { if (g.category) set[g.category] = true; });
    return Object.keys(set).sort();
  }

  function makeCategoryPill(label, value) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-pill' + (activeCategory === value ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', function () {
      activeCategory = value;
      renderCategoryPills();
      renderPriceList();
    });
    return btn;
  }

  function renderCategoryPills() {
    var categories = getCategories();
    var hasUncategorized = CATALOG.some(function (g) { return !g.category; });
    var wrap = document.getElementById('category-pills');
    wrap.innerHTML = '';

    if (categories.length === 0) {
      wrap.style.display = 'none';
      return;
    }

    wrap.style.display = '';
    wrap.appendChild(makeCategoryPill('Все', null));
    categories.forEach(function (c) { wrap.appendChild(makeCategoryPill(c, c)); });
    if (hasUncategorized) {
      wrap.appendChild(makeCategoryPill('Остальное', OTHER_CATEGORY));
    }
  }

  // ---- Вкладка "Прайс-лист": карточка на товар, клик по цене — сразу добавляет в список ----
  function renderPriceList() {
    var query = document.getElementById('price-search').value.trim().toLowerCase();
    var wrap = document.getElementById('price-list');
    wrap.innerHTML = '';
    var any = false;

    CATALOG.forEach(function (g, gi) {
      if (query && g.baseName.toLowerCase().indexOf(query) === -1) return;
      if (activeCategory === OTHER_CATEGORY) {
        if (g.category) return;
      } else if (activeCategory && g.category !== activeCategory) {
        return;
      }
      any = true;

      var row = document.createElement('div');
      row.className = 'price-group';

      var info = document.createElement('div');
      var h3 = document.createElement('h3');
      h3.textContent = g.baseName;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = g.variants.length + (g.variants.length === 1 ? ' фасовка' : ' фасовки');
      info.appendChild(h3);
      info.appendChild(meta);

      var variants = document.createElement('div');
      variants.className = 'price-variants';

      g.variants.forEach(function (v) {
        var line = document.createElement('div');
        line.className = 'price-line';

        var amount = document.createElement('span');
        amount.className = 'amount';
        amount.textContent = formatAmount(v.amount) + ' ' + g.unit;

        var dots = document.createElement('span');
        dots.className = 'dots';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'price-btn';
        btn.textContent = formatMoney(v.price);
        btn.title = 'Добавить в список';
        btn.addEventListener('click', function () { addToCartFromPrice(gi, v.id, g.baseName, btn); });

        line.appendChild(amount);
        line.appendChild(dots);
        line.appendChild(btn);
        variants.appendChild(line);
      });

      row.appendChild(info);
      row.appendChild(variants);
      wrap.appendChild(row);
    });

    if (!any) {
      var empty = document.createElement('div');
      empty.className = 'price-search-empty';
      empty.textContent = 'Ничего не найдено';
      wrap.appendChild(empty);
    }
  }

  // Клик по цене в прайс-листе: если такая фасовка уже в списке — увеличиваем количество,
  // иначе занимаем первую пустую строку или добавляем новую. Плюс — короткая обратная связь
  // (вспышка кнопки + всплывающее сообщение), чтобы было видно, что клик сработал.
  function addToCartFromPrice(groupIdx, variantId, groupName, btnEl) {
    var existing = rows.find(function (r) { return r.group === groupIdx && r.variant === variantId; });
    if (existing) {
      existing.qty += 1;
    } else {
      var empty = rows.find(function (r) { return r.group === null; });
      if (empty) {
        empty.group = groupIdx;
        empty.variant = variantId;
        empty.qty = 1;
      } else {
        rows.push({ group: groupIdx, variant: variantId, qty: 1 });
      }
    }

    renderCart();
    showToast('Добавлено: ' + groupName);

    if (btnEl) {
      btnEl.classList.add('added');
      setTimeout(function () { btnEl.classList.remove('added'); }, 450);
    }
  }

  var toastTimer = null;
  function showToast(message) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  // ---- Вкладка "Собрать список" (конструктор строк: товар → фасовка → кол-во → цена) ----
  function addRow() {
    rows.push({ group: null, variant: null, qty: 1 });
    renderCart();
    var scrollArea = document.getElementById('cart-rows');
    scrollArea.scrollTop = scrollArea.scrollHeight;
  }

  function removeRow(index) {
    rows.splice(index, 1);
    if (rows.length === 0) { rows.push({ group: null, variant: null, qty: 1 }); }
    renderCart();
  }

  function setGroup(index, groupValue) {
    var groupIdx = groupValue === '' ? null : parseInt(groupValue, 10);
    rows[index].group = groupIdx;
    var variants = groupIdx !== null ? CATALOG[groupIdx].variants : [];
    rows[index].variant = variants.length > 0 ? variants[0].id : null;
    renderCart();
  }

  function setVariant(index, variantValue) {
    rows[index].variant = variantValue === '' ? null : parseInt(variantValue, 10);
    renderCart();
  }

  function setQty(index, qtyValue) {
    rows[index].qty = Math.max(1, parseInt(qtyValue, 10) || 1);
    renderCart();
  }

  function buildRowElement(row, index) {
    var variant = findVariant(row.group, row.variant);
    var lineTotal = variant ? variant.price * row.qty : 0;

    if (READONLY) {
      return buildReadonlyRowElement(row, variant, lineTotal);
    }

    var el = document.createElement('div');
    el.className = 'order-row';

    // Товар
    var colProduct = document.createElement('div'); colProduct.className = 'col grow';
    var labelP = document.createElement('label'); labelP.textContent = 'Товар';
    var selProduct = document.createElement('select');
    var optEmpty = document.createElement('option'); optEmpty.value = ''; optEmpty.textContent = 'Выберите товар…';
    selProduct.appendChild(optEmpty);
    CATALOG.forEach(function (g, gi) {
      var opt = document.createElement('option');
      opt.value = gi;
      opt.textContent = g.baseName;
      if (row.group === gi) opt.selected = true;
      selProduct.appendChild(opt);
    });
    selProduct.addEventListener('change', function () { setGroup(index, selProduct.value); });
    colProduct.appendChild(labelP); colProduct.appendChild(selProduct);

    // Фасовка
    var colVariant = document.createElement('div'); colVariant.className = 'col';
    var labelV = document.createElement('label'); labelV.textContent = 'Фасовка';
    var selVariant = document.createElement('select');
    selVariant.disabled = row.group === null;
    var optEmpty2 = document.createElement('option'); optEmpty2.value = ''; optEmpty2.textContent = '—';
    selVariant.appendChild(optEmpty2);
    if (row.group !== null) {
      CATALOG[row.group].variants.forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = formatAmount(v.amount) + ' ' + CATALOG[row.group].unit;
        if (row.variant === v.id) opt.selected = true;
        selVariant.appendChild(opt);
      });
    }
    selVariant.addEventListener('change', function () { setVariant(index, selVariant.value); });
    colVariant.appendChild(labelV); colVariant.appendChild(selVariant);

    // Кол-во
    var colQty = document.createElement('div'); colQty.className = 'col';
    var labelQ = document.createElement('label'); labelQ.textContent = 'Кол-во';
    var inputQty = document.createElement('input');
    inputQty.type = 'number'; inputQty.min = '1'; inputQty.value = row.qty;
    inputQty.addEventListener('change', function () { setQty(index, inputQty.value); });
    colQty.appendChild(labelQ); colQty.appendChild(inputQty);

    // Цена
    var colPrice = document.createElement('div'); colPrice.className = 'col price-sum';
    var labelPr = document.createElement('label'); labelPr.textContent = 'Цена';
    var spanPrice = document.createElement('span'); spanPrice.textContent = variant ? formatMoney(variant.price) : '—';
    colPrice.appendChild(labelPr); colPrice.appendChild(spanPrice);

    // Сумма
    var colSum = document.createElement('div'); colSum.className = 'col price-sum';
    var labelS = document.createElement('label'); labelS.textContent = 'Сумма';
    var spanSum = document.createElement('span'); spanSum.textContent = formatMoney(lineTotal);
    colSum.appendChild(labelS); colSum.appendChild(spanSum);

    // Удалить строку
    var btnRemove = document.createElement('button');
    btnRemove.type = 'button'; btnRemove.className = 'remove'; btnRemove.innerHTML = '&times;';
    btnRemove.title = 'Удалить строку';
    btnRemove.addEventListener('click', function () { removeRow(index); });

    el.appendChild(colProduct);
    el.appendChild(colVariant);
    el.appendChild(colQty);
    el.appendChild(colPrice);
    el.appendChild(colSum);
    el.appendChild(btnRemove);
    return el;
  }

  // Тот же ряд, но без выпадающих списков/полей и кнопки удаления — используется, когда страница
  // открыта с уже готовым списком (пришла через "Поделиться"): получателю нечего редактировать.
  function buildReadonlyRowElement(row, variant, lineTotal) {
    var g = row.group !== null ? CATALOG[row.group] : null;

    var el = document.createElement('div');
    el.className = 'order-row readonly';

    var colProduct = document.createElement('div'); colProduct.className = 'col grow';
    var labelP = document.createElement('label'); labelP.textContent = 'Товар';
    var valP = document.createElement('div'); valP.className = 'ro-value'; valP.textContent = g ? g.baseName : '—';
    colProduct.appendChild(labelP); colProduct.appendChild(valP);

    var colVariant = document.createElement('div'); colVariant.className = 'col';
    var labelV = document.createElement('label'); labelV.textContent = 'Фасовка';
    var valV = document.createElement('div'); valV.className = 'ro-value';
    valV.textContent = variant ? (formatAmount(variant.amount) + ' ' + g.unit) : '—';
    colVariant.appendChild(labelV); colVariant.appendChild(valV);

    var colQty = document.createElement('div'); colQty.className = 'col';
    var labelQ = document.createElement('label'); labelQ.textContent = 'Кол-во';
    var valQ = document.createElement('div'); valQ.className = 'ro-value'; valQ.textContent = String(row.qty);
    colQty.appendChild(labelQ); colQty.appendChild(valQ);

    var colPrice = document.createElement('div'); colPrice.className = 'col price-sum';
    var labelPr = document.createElement('label'); labelPr.textContent = 'Цена';
    var spanPrice = document.createElement('span'); spanPrice.textContent = variant ? formatMoney(variant.price) : '—';
    colPrice.appendChild(labelPr); colPrice.appendChild(spanPrice);

    var colSum = document.createElement('div'); colSum.className = 'col price-sum';
    var labelS = document.createElement('label'); labelS.textContent = 'Сумма';
    var spanSum = document.createElement('span'); spanSum.textContent = formatMoney(lineTotal);
    colSum.appendChild(labelS); colSum.appendChild(spanSum);

    el.appendChild(colProduct);
    el.appendChild(colVariant);
    el.appendChild(colQty);
    el.appendChild(colPrice);
    el.appendChild(colSum);
    return el;
  }

  function renderCart() {
    var wrap = document.getElementById('cart-rows');
    wrap.innerHTML = '';
    rows.forEach(function (row, index) { wrap.appendChild(buildRowElement(row, index)); });
    updateTotals();
  }

  function updateTotals() {
    var count = 0, sum = 0;
    rows.forEach(function (row) {
      var variant = findVariant(row.group, row.variant);
      if (!variant) return;
      count += row.qty;
      sum += variant.price * row.qty;
    });

    document.getElementById('cart-total').textContent = formatMoney(sum);
    document.getElementById('cart-count').textContent = count > 0 ? ('В списке: ' + count + ' шт.') : 'Список пуст';
    document.getElementById('export-btn').disabled = count === 0;
    document.getElementById('share-btn').disabled = count === 0;

    var badge = document.getElementById('cart-tab-badge');
    badge.textContent = count;
    badge.hidden = count === 0;
  }

  // И "Скачать список", и "Поделиться" отдают ОДНО И ТО ЖЕ — целую самодостаточную HTML-страницу
  // с уже заполненным списком (см. cart-preset выше), а не плоский CSV: получатель открывает файл
  // и сразу видит готовый список в режиме только для чтения, а не таблицу с числами.
  function buildShareableHtml() {
    var preset = rows.filter(function (r) { return r.group !== null && r.variant !== null; });
    var presetEl = document.getElementById('cart-preset');
    var previousPreset = presetEl.textContent;
    presetEl.textContent = JSON.stringify(preset);
    var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    presetEl.textContent = previousPreset;
    return html;
  }

  function downloadCart() {
    var html = buildShareableHtml();
    var blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'moy-spisok.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Веб-API "Поделиться" — открывает системное меню (Telegram, WhatsApp, почта и т.п.), как в мобильных
  // приложениях.
  async function shareCart() {
    var html = buildShareableHtml();
    var shareData = { title: 'Мой список покупок', text: 'Мой список покупок — откройте вложенный файл.' };

    try {
      var file = new File([html], 'moy-spisok.html', { type: 'text/html' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        shareData.files = [file];
      }
    } catch (e) {
      // File API недоступен/бросил — делимся без вложения, только текстом.
    }

    try {
      await navigator.share(shareData);
    } catch (err) {
      if (err && err.name !== 'AbortError') {
        showToast('Не удалось поделиться. Попробуйте скачать файл.');
      }
    }
  }

  // Прячет вкладки и все кнопки редактирования — страница, присланная клиенту, должна быть
  // просто готовым списком для чтения, а не рабочим инструментом сборки заказа.
  function applyReadonlyMode() {
    // .tabs и .actions заданы через display:flex в CSS — атрибут hidden их не перекроет
    // (у автора стиля выше приоритет, чем у правила [hidden] из UA-таблицы), поэтому здесь
    // нужен именно инлайн-стиль.
    var tabs = document.querySelector('.tabs');
    if (tabs) { tabs.style.display = 'none'; }

    var addRowBtn = document.getElementById('add-row-btn');
    if (addRowBtn) { addRowBtn.hidden = true; }

    var actions = document.querySelector('.cart-footer .actions');
    if (actions) { actions.style.display = 'none'; }

    var subtitle = document.getElementById('header-subtitle');
    if (subtitle) { subtitle.textContent = 'Ваш список — ничего менять не нужно.'; }

    var footer = document.getElementById('page-footer');
    if (footer) { footer.textContent = 'Если нужно что-то изменить — просто напишите нам.'; }
  }

  // ---- Переключение вкладок ----
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  document.getElementById('price-search').addEventListener('input', renderPriceList);
  document.getElementById('add-row-btn').addEventListener('click', addRow);
  document.getElementById('export-btn').addEventListener('click', downloadCart);
  document.getElementById('clear-btn').addEventListener('click', function () {
    rows = [{ group: null, variant: null, qty: 1 }];
    renderCart();
  });

  if (navigator.share) {
    var shareBtn = document.getElementById('share-btn');
    shareBtn.hidden = false;
    shareBtn.addEventListener('click', shareCart);
  }

  // Файл открыт с уже готовым списком (пришёл через "Поделиться") — сразу показываем вкладку
  // "Собрать список" и переводим всю страницу в режим только для чтения (см. applyReadonlyMode).
  if (READONLY) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
    var cartTabBtn = document.querySelector('.tab[data-tab="cart"]');
    if (cartTabBtn) { cartTabBtn.classList.add('active'); }
    document.getElementById('tab-cart').classList.add('active');
    applyReadonlyMode();
  } else {
    renderCategoryPills();
    renderPriceList();
  }

  renderCart();
})();
</script>
</body>
</html>
